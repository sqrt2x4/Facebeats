<!DOCTYPE html>
<html>

<head>
    <title>🫆 Register User 🫆</title>
    <style>
        .music-bg {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        }

        .note {
            position: absolute;
            color: rgba(215, 85, 255, 0.6);
            font-weight: bold;
            animation: floatNote linear infinite;
        }

        .note:hover {
            transform: scale(1.5);
        }

        .n1 {
            left: 10%;
            top: 80%;
            font-size: 25px;
            animation-duration: 24s;
        }

        .n2 {
            left: 20%;
            top: 60%;
            font-size: 37px;
            animation-duration: 19s;
        }

        .n3 {
            left: 35%;
            top: 90%;
            font-size: 29px;
            animation-duration: 25s;
        }

        .n4 {
            left: 50%;
            top: 70%;
            font-size: 42px;
            animation-duration: 28s;
        }

        .n5 {
            left: 65%;
            top: 85%;
            font-size: 21px;
            animation-duration: 17s;
        }

        .n6 {
            left: 80%;
            top: 75%;
            font-size: 34px;
            animation-duration: 19s;
        }

        .n7 {
            left: 90%;
            top: 65%;
            font-size: 29px;
            animation-duration: 26s;
        }

        .n8 {
            left: 40%;
            top: 50%;
            font-size: 33px;
            animation-duration: 21s;
        }

        .n9 {
            left: 75%;
            top: 95%;
            font-size: 40px;
            animation-duration: 24s;
        }

        @keyframes floatNote {
            from {
                transform: translateY(0px) rotate(0deg);
            }

            to {
                transform: translateY(-120vh) rotate(360deg);
            }
        }

        body {
            background: linear-gradient(135deg, #FFB6C1, #d8b4ff);
            font-family: Arial, sans-serif;
            text-align: center;

            display: flex;
            flex-direction: column;
            align-items: center;

            min-height: 100vh;

            margin: 0;
            padding: 30px 0;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 25px;
            width: 500px;
            text-align: center;
            margin-bottom: 16px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
            animation: float 5s ease-in-out infinite;
        }
        @keyframes float {
                0%, 100% {
                 transform: translateY(0);
                }
                50% {
                 transform: translateY(-20px);
                }
        }

        h1 {
            color: hotpink;
            margin-bottom: 10px;
        }

        h2 {
            color: #ffa9ff;
        }

        form {
            background-color: #ffb7df;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        label {
            font-weight: bold;
            color: gray;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .subtitle {
            color: gray;
            margin-bottom: 20px;
        }

        button {
            background: hotpink;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            margin: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: deeppink;
            transform: scale(1.05);
        }

    </style>
</head>

<body>
    <div class="music-bg">
        <span class="note n1">♪</span>
        <span class="note n2">♫</span>
        <span class="note n3">♬</span>
        <span class="note n4">♪</span>
        <span class="note n5">♫</span>
        <span class="note n6">♬</span>
        <span class="note n7">♪</span>
        <span class="note n8">♫</span>
        <span class="note n9">♬</span>
    </div>


 <div class="card" >
    <h1> 🩷 FaceBeats 🩷</h1>
        <h1>🎀 Register New User 🎀</h1>

        <p class="subtitle">
            Write your name and your favorite songs to be recognized by our smart music player! ♪</p>
    </div>

<form method="POST" class="card">

    <label>Name:</label>
    <input type="text" name="name" required>

    <h2>Song 1 🎵</h2>

    <label>Title:</label>
    <input type="text" name="song1">

    <label>Artist:</label>
    <input type="text" name="artist1">

    <h2>Song 2 🎶</h2>

    <label>Title:</label>
    <input type="text" name="song2">

    <label>Artist:</label>
    <input type="text" name="artist2">

    <h2>Song 3 🎧</h2>

    <label>Title:</label>
    <input type="text" name="song3">

    <label>Artist:</label>
    <input type="text" name="artist3">

    <button type="submit">
        Save User 🩷
    </button>

</form>
    <a href="/"><button>Back to Home 🏠</button></a>
</body>
</html>
